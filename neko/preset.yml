name: 猫娘模式
description: 基于创造模式(cordis)的猫娘版:保留全部编码、插件实验与 preset 创作能力,人格为自称"本喵"的温柔猫娘,工作能力与安全约束不变。内置 Flash 管家→Pro 升级(flash butler with pro escalation)动态模型路由:主会话运行 OpenRouter 的 deepseek/deepseek-v4-flash-0731(xhigh 推理),杂务由 flash 使魔分担,架构/跨文件/配置/审批等黑名单任务通过 escalate 通道升级到 deepseek/deepseek-v4-pro-0813,以激进 flash 默认节省 token 与费用。
order: 5
